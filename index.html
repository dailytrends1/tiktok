<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação · Bem-vindo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      padding: 20px;
      position: relative;
    }

    /* subtle background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(#94a3b8 1.2px, transparent 1.2px);
      background-size: 32px 32px;
      opacity: 0.12;
      pointer-events: none;
    }

    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      padding: 44px 34px 40px;
      border-radius: 40px;
      box-shadow: 0 24px 56px -12px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(226, 232, 240, 0.7);
      backdrop-filter: blur(2px);
      transition: all 0.2s ease;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    /* verified tick at the top */
    .verified-top {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .tick-circle {
      width: 80px;
      height: 80px;
      background: #e6f7ec;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px -6px rgba(15, 151, 61, 0.15);
    }

    .tick-mark {
      background: #0f973d;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 32px;
      font-weight: 600;
      box-shadow: 0 6px 14px -4px rgba(15, 151, 61, 0.3);
    }

    /* typography */
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #0b1a2b;
      letter-spacing: -0.3px;
      margin-bottom: 10px;
    }

    .subhead {
      font-size: 17px;
      color: #475569;
      line-height: 1.6;
      max-width: 380px;
      margin: 0 auto 20px;
    }

    .highlight-box {
      background: #f9fbfd;
      border-radius: 20px;
      padding: 18px 18px;
      margin: 24px 0 28px;
      border: 1px solid #e9edf2;
      text-align: left;
    }

    .highlight-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 0;
      color: #1e293b;
      font-size: 15px;
      font-weight: 450;
      border-bottom: 1px solid #ecf1f6;
    }

    .highlight-row:last-child {
      border-bottom: none;
    }

    .check-icon {
      color: #0f973d;
      font-weight: 700;
      font-size: 18px;
      width: 24px;
      display: inline-block;
    }

    /* main CTA */
    .btn-primary {
      width: 100%;
      background: linear-gradient(145deg, #0f973d, #0b7a33);
      border: none;
      padding: 18px 20px;
      border-radius: 60px;
      color: white;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 12px 28px -8px rgba(15, 151, 61, 0.25);
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 34px -12px rgba(15, 151, 61, 0.35);
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-primary .arrow {
      transition: transform 0.2s ease;
      display: inline-block;
    }

    .btn-primary:hover .arrow {
      transform: translateX(4px);
    }

    .note {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 20px;
      letter-spacing: 0.2px;
    }

    /* responsive */
    @media (max-width: 460px) {
      .card { padding: 32px 20px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="card" role="main">

    <!-- verified tick at the top -->
    <div class="verified-top">
      <div class="tick-circle">
        <div class="tick-mark">✓</div>
      </div>
    </div>

    <h1>Bem-vindo! 👋</h1>
    <p class="subhead">
      Por favor, clique no botão abaixo para confirmar que <strong>você não é um robô</strong>.
    </p>

    <div class="highlight-box">
      <div class="highlight-row">
        <span class="check-icon">✓</span>
        <span>Verificação de segurança</span>
      </div>
      <div class="highlight-row">
        <span class="check-icon">✓</span>
        <span>Clique no botão para continuar</span>
      </div>
      <div class="highlight-row">
        <span class="check-icon">✓</span>
        <span>Processo rápido e seguro</span>
      </div>
    </div>

    <!-- button opens the link directly -->
    <a href="https://ln.run/personal" target="_blank" rel="noopener noreferrer" style="text-decoration: none; display: block;">
      <button class="btn-primary" id="continueBtn">
        CONTINUAR
        <span class="arrow">→</span>
      </button>
    </a>

    <p class="note">Ao continuar, você confirma que é humano.</p>
  </div>

  <script>
    // (optional) any additional logic – the link already works via the anchor
    // but we keep a small console message for clarity
    (function() {
      const btn = document.getElementById('continueBtn');
      if (btn) {
        // the button is inside an <a> so it already navigates.
        // we can add a tiny feedback if needed.
        console.log('✅ Landing page pronta. Clique em CONTINUAR para abrir o link.');
      }
    })();
  </script>
</body>
</html>
